name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wheatworld-1.21.11-source/wheatworld-1.21.11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - name: Build
        run: gradle build --no-daemon
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: wheatworld-jar
          path: |
            wheatworld-1.21.11-source/wheatworld-1.21.11/build/libs/wheatworld-*.jar
            !wheatworld-1.21.11-source/wheatworld-1.21.11/build/libs/*-sources.jar
